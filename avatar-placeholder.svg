<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="196" fill="url(#avatarGrad)" stroke="#cbd5e1" stroke-width="4"/>
  
  <!-- Subtle Blueprint Grid Pattern inside circle -->
  <g opacity="0.2" stroke="#334155" stroke-width="1.5">
    <circle cx="200" cy="200" r="140" fill="none" stroke-dasharray="6,6"/>
    <circle cx="200" cy="200" r="80" fill="none"/>
    <line x1="200" y1="20" x2="200" y2="380" stroke-dasharray="4,4"/>
    <line x1="20" y1="200" x2="380" y2="200" stroke-dasharray="4,4"/>
  </g>

  <!-- Stylized Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="58" fill="#94a3b8" />
  
  <!-- Torso -->
  <path d="M110 320 C110 240, 150 225, 200 225 C250 225, 290 240, 290 320 Z" fill="#64748b" />
  
  <!-- Mechanical Caliper / Pin Accent -->
  <circle cx="200" cy="265" r="7" fill="url(#accentGrad)"/>
</svg>
